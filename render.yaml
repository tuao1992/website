# Render blueprint for Approval Desk — free tier, with data stored in
# Supabase (also free) so nothing is lost when the free service restarts.
#
# Before deploying:
#   1. Create a free project at https://supabase.com
#   2. Run approval-app/supabase-setup.sql in its SQL Editor
#   3. Grab the project URL and the service_role key
#      (Project Settings → API)
#
# Deploy: https://dashboard.render.com → New → Blueprint → pick this repo.
services:
  - type: web
    name: approval-desk
    runtime: node
    rootDir: approval-app
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false # your dashboard password — Render prompts for it at deploy time
      - key: SUPABASE_URL
        sync: false # e.g. https://abcdefgh.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false # the service_role key from Supabase → Project Settings → API
